[package]
name = "fob"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Command line client for the Fob identity provider"
repository = "https://github.com/fobauth/cli"
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4.6.8", features = ["derive", "env"] }
directories = "6.0.0"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
